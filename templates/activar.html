{% extends 'afiliados/base.html' %}
{% block title %}Activa tu acceso{% endblock %}
{% block body %}
<section class="card narrow">
  <h1>Activa tu acceso</h1>
  <p id="hola" class="muted">Verificando tu enlace…</p>
  <form id="fAct" hidden novalidate>
    <label for="p1">Crea una contraseña (mínimo 8)</label><input id="p1" type="password" autocomplete="new-password" minlength="8" required>
    <label for="p2">Repite la contraseña</label><input id="p2" type="password" autocomplete="new-password" required>
    <button class="btn block">Entrar a mi portal</button>
  </form>
  <p id="msg" class="msg" role="alert"></p>
  <p id="nuevo" hidden><a class="btn gold" href="/afiliados/login">Pedir un enlace nuevo</a></p>
</section>
{% endblock %}
{% block scripts %}
<script>
const $=id=>document.getElementById(id),msg=(t,ok)=>{$('msg').textContent=t||'';$('msg').className='msg '+(t?(ok?'ok':'err'):'')};
const token=new URLSearchParams(location.search).get('t')||'';
history.replaceState(null,'',location.pathname);   // el enlace no queda en la barra de direcciones
async function post(url,body){const r=await fetch(url,{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify(body)});let d={};try{d=await r.json()}catch(e){}if(!r.ok)throw new Error(d.error||'No se pudo completar la acción.');return d}
(async()=>{try{const r=await fetch('/afiliados/api/activar/validar?t='+encodeURIComponent(token));const d=await r.json();
  if(!r.ok)throw new Error(d.error||'Enlace no válido.');
  $('hola').textContent='Hola '+d.nombre+' 👋 Crea tu contraseña para '+d.correo+'.';$('fAct').hidden=false}
  catch(e){$('hola').textContent='';msg(e.message);$('nuevo').hidden=false}})();
$('fAct').onsubmit=async e=>{e.preventDefault();msg('');if($('p1').value!==$('p2').value){msg('Las contraseñas no coinciden.');return}
  try{const d=await post('/afiliados/api/activar',{token,password:$('p1').value});msg('¡Listo! Entrando…',true);location.href=d.redirect}catch(x){msg(x.message);$('nuevo').hidden=false}};
</script>
{% endblock %}
