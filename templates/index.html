<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador 3D de Bandejas - Viane Delicatessen</title>
    <!-- Tailwind CSS CDN -->
    <script src="[https://cdn.tailwindcss.com](https://cdn.tailwindcss.com)"></script>
    <!-- FontAwesome icons -->
    <link rel="stylesheet" href="[https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css](https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css)">
    <!-- Google Fonts -->
    <link href="[https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap](https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700;900&family=Plus+Jakarta+Sans:wght@300;400;600;700&display=swap)" rel="stylesheet">
    <!-- Three.js CDN -->
    <script src="[https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js](https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js)"></script>
    <!-- OrbitControls for Three.js -->
    <script src="[https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js](https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js)"></script>

    <script>
        tailwind.config = {
            theme: {
                extend: {
                    colors: {
                        viane: {
                            gold: '#D4AF37',
                            goldlight: '#F3E5AB',
                            golddark: '#AA820A',
                            cream: '#FAF8F5',
                            card: '#FFFFFF',
                            ebony: '#1A120B',
                            red: '#C40C1A',
                            accent: '#C59B27',
                            softgray: '#F0ECE6'
                        }
                    },
                    fontFamily: {
                        cinzel: ['Cinzel', 'serif'],
                        sans: ['Plus Jakarta Sans', 'sans-serif']
                    }
                }
            }
        }
    </script>

    <style>
        body { font-family: 'Plus Jakarta Sans', sans-serif; background-color: #FAF8F5; color: #1A120B; overflow-x: hidden; }
        .gold-gradient-text { background: linear-gradient(135deg, #D4AF37 0%, #AA820A 50%, #F3E5AB 100%); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        .gold-bg-gradient { background: linear-gradient(135deg, #D4AF37 0%, #B88E18 100%); }
        #viewport-container { position: relative; width: 100%; height: 100%; min-height: 500px; background: radial-gradient(circle at center, #FFFFFF 0%, #EFEBE4 70%, #DCD6CC 100%); }
        .glass-panel { background: rgba(255, 255, 255, 0.88); backdrop-filter: blur(14px); border: 1px solid rgba(212, 175, 55, 0.25); }
        button, input, select { transition: all .18s ease; }
        #logo-preview { width: 64px; height: 64px; object-fit: cover; border-radius: 50%; border: 2px solid #D4AF37; }
    </style>
</head>
<body class="flex flex-col min-h-screen">

    <!-- HEADER / BRANDING BANNER -->
    <header class="bg-viane-ebony text-white shadow-xl relative z-20 border-b-2 border-viane-gold/40">
        <div class="max-w-7xl mx-auto px-4 py-3 flex flex-col md:flex-row items-center justify-between gap-4">
            <div class="flex items-center gap-3">
                <div class="w-12 h-12 rounded-full border-2 border-viane-gold bg-viane-red flex items-center justify-center overflow-hidden shadow-md">
                    <img id="site-logo" src="IMG-20260327-WA0017.jpg" alt="VD" class="w-full h-full object-cover" onerror="this.src='[https://placehold.co/100x100/1A120B/D4AF37?text=VD](https://placehold.co/100x100/1A120B/D4AF37?text=VD)';">
                </div>
                <div>
                    <h1 class="font-cinzel text-xl md:text-2xl font-bold tracking-wider gold-gradient-text">VIANE DELICATESSEN</h1>
                    <p class="text-xs text-viane-goldlight/80 tracking-widest uppercase font-light">Bandejas Gourmet 360°</p>
                </div>
            </div>

            <div class="flex items-center gap-3">
                <button onclick="window.location.href='/'" class="flex items-center gap-2 px-4 py-2 text-xs font-semibold uppercase tracking-wider rounded-lg bg-viane-gold/10 hover:bg-viane-gold hover:text-viane-ebony text-viane-gold border border-viane-gold/50 transition-all">
                    <i class="fa-solid fa-house text-sm"></i>
                    <span>Volver a la Tienda</span>
                </button>
            </div>
        </div>
    </header>

    <!-- MAIN CONFIGURATOR CONTAINER -->
    <main class="flex-1 flex flex-col lg:flex-row max-w-[1600px] w-full mx-auto p-3 md:p-6 gap-6">

        <!-- VISOR 3D CANVAS -->
        <div class="flex-1 flex flex-col rounded-2xl overflow-hidden bg-white border border-viane-gold/20 shadow-xl relative min-h-[500px]">
            <div class="bg-viane-cream border-b border-viane-gold/20 px-4 py-3 flex items-center justify-between">
                <div class="flex items-center gap-2">
                    <span class="w-3 h-3 rounded-full bg-viane-gold animate-pulse"></span>
                    <h2 class="font-cinzel font-bold text-sm text-viane-ebony">Visor 3D Interactivo</h2>
                </div>
                <div class="text-xs text-viane-brown/70">
                    <i class="fa-solid fa-hand-pointer"></i>
                    <span>Arrastra los productos para acomodarlos en la bandeja</span>
                </div>
            </div>

            <div id="viewport-container" class="relative flex-1">
                <canvas id="three-canvas" class="w-full h-full block cursor-grab active:cursor-grabbing"></canvas>
                
                <div class="absolute bottom-4 left-4 z-10 flex gap-2">
                    <button onclick="resetCamera()" class="p-2.5 rounded-xl glass-panel text-viane-ebony hover:text-viane-gold hover:bg-viane-ebony transition-all shadow-md text-xs font-semibold flex items-center gap-1.5">
                        <i class="fa-solid fa-video"></i>
                        <span>Restablecer Vista</span>
                    </button>
                    <button onclick="clearTrayObjects()" class="p-2.5 rounded-xl glass-panel text-red-600 hover:bg-red-600 hover:text-white transition-all shadow-md text-xs font-semibold flex items-center gap-1.5">
                        <i class="fa-solid fa-trash-can"></i>
                        <span>Vaciar Productos</span>
                    </button>
                </div>

                <div class="absolute top-4 right-4 z-10 glass-panel px-4 py-2.5 rounded-xl shadow-lg border border-viane-gold/30">
                    <span class="text-[10px] text-viane-brown/70 uppercase tracking-widest font-bold block">Bandeja Actual</span>
                    <h3 id="current-tray-title" class="font-cinzel text-viane-ebony font-bold text-sm">Cargando...</h3>
                    <p id="current-tray-price" class="text-xs text-viane-golddark font-bold mt-0.5">$0.00</p>
                </div>
            </div>

            <!-- CARRUSEL DE BANDEJAS -->
            <div class="bg-viane-cream border-t border-viane-gold/20 p-4">
                <div class="flex items-center justify-between mb-3">
                    <h3 class="font-cinzel font-bold text-sm text-viane-ebony">Selecciona el Estilo de Bandeja</h3>
                </div>
                <div id="trays-carousel-container" class="grid grid-cols-2 sm:grid-cols-4 gap-3"></div>
            </div>
        </div>

        <!-- PANEL DE PRODUCTOS Y PERSONALIZACIÓN -->
        <div class="w-full lg:w-96 flex flex-col gap-6">

            <!-- TEXTO PERSONALIZADO -->
            <div class="bg-white rounded-2xl border border-viane-gold/20 shadow-lg p-5">
                <h3 class="font-cinzel font-bold text-sm text-viane-ebony mb-2">Mensaje o Grabado 3D</h3>
                <input type="text" id="custom-tray-text" placeholder="Ej: Feliz Cumpleaños" maxlength="25" oninput="updateTrayText(this.value)" class="w-full px-3.5 py-2 text-sm rounded-xl border border-viane-gold/30 outline-none bg-viane-cream/30">
            </div>

            <!-- AGREGAR PRODUCTOS -->
            <div class="bg-white rounded-2xl border border-viane-gold/20 shadow-lg p-5 flex-1 flex flex-col">
                <h3 class="font-cinzel font-bold text-sm text-viane-ebony mb-3">Añadir Productos</h3>
                <div id="products-catalog-grid" class="grid grid-cols-2 gap-3 overflow-y-auto max-h-[300px]"></div>
            </div>

            <!-- RESUMEN -->
            <div class="bg-viane-ebony text-white rounded-2xl border border-viane-gold/30 p-5 shadow-xl">
                <div class="flex justify-between items-center mb-3 text-xs text-viane-goldlight/80 border-b border-white/10 pb-2">
                    <span>Resumen</span>
                    <span id="items-count-badge" class="px-2 py-0.5 rounded-full bg-viane-gold/20 text-viane-gold font-bold text-[10px]">0 elementos</span>
                </div>
                <div class="space-y-2 mb-4 max-h-32 overflow-y-auto text-xs" id="order-items-list"></div>
                <div class="flex justify-between items-end border-t border-white/10 pt-3 mb-4">
                    <div>
                        <span class="text-xs text-viane-goldlight/60 block">Total Estimado</span>
                        <span class="font-cinzel font-bold text-xl gold-gradient-text" id="order-total-price">$0.00</span>
                    </div>
                </div>
                <button onclick="requestQuote()" class="w-full py-3 rounded-xl gold-bg-gradient text-viane-ebony font-bold text-sm shadow-lg hover:brightness-110 flex items-center justify-center gap-2">
                    <i class="fa-brands fa-whatsapp text-lg"></i>
                    <span>Solicitar Pedido por WhatsApp</span>
                </button>
            </div>
        </div>
    </main>

    <!-- LÓGICA TÉCNICA TRES.JS -->
    <script>
        let state = {
            trays: [
                { id: 'tray-1', name: 'Bandeja Roble Clásica', price: 25.00, material: 'wood', color: '#8B5A2B' },
                { id: 'tray-2', name: 'Bandeja Cristal Lujo', price: 40.00, material: 'glass', color: '#FFFFFF' },
                { id: 'tray-3', name: 'Bandeja Dorado Imperial', price: 45.00, material: 'gold', color: '#D4AF37' },
                { id: 'tray-4', name: 'Bandeja Ébano Negra', price: 30.00, material: 'black', color: '#1A1A1A' }
            ],
            products: [
                { id: 'prod-1', name: 'Vino Tinto Reserva', price: 28.00, shape: 'bottle', color: '#4A0E17', icon: 'fa-wine-bottle' },
                { id: 'prod-2', name: 'Chocolates Premium', price: 16.50, shape: 'box', color: '#D4AF37', icon: 'fa-box-open' },
                { id: 'prod-3', name: 'Copa Grabada', price: 12.00, shape: 'cylinder', color: '#E0F7FA', icon: 'fa-glass-water' },
                { id: 'prod-4', name: 'Esfera Decorativa', price: 9.50, shape: 'sphere', color: '#B88E18', icon: 'fa-circle' }
            ],
            selectedTrayIndex: 0,
            addedObjects: [],
            customText: ''
        };

        let scene, camera, renderer, controls;
        let trayMesh = null;
        let trayProductsGroup = new THREE.Group();
        let textMeshGroup = new THREE.Group();

        // Variables para Arrastrar Objetos (Drag Engine)
        let raycaster = new THREE.Raycaster();
        let mouse = new THREE.Vector2();
        let selectedObject = null;
        let plane = new THREE.Plane(new THREE.Vector3(0, 1, 0), 0);
        let planeIntersect = new THREE.Vector3();

        function initThree() {
            const container = document.getElementById('viewport-container');
            scene = new THREE.Scene();

            camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
            camera.position.set(0, 10, 14);

            renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true, alpha: true });
            renderer.setSize(container.clientWidth, container.clientHeight);
            renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));

            controls = new THREE.OrbitControls(camera, renderer.domElement);
            controls.enableDamping = true;
            controls.maxPolarAngle = Math.PI / 2 - 0.05;

            // Iluminación
            const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
            scene.add(ambientLight);

            const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.2);
            dirLight.position.set(10, 20, 15);
            scene.add(dirLight);

            scene.add(trayProductsGroup);
            scene.add(textMeshGroup);

            buildTray3D();

            // Eventos de arrastre
            const canvas = renderer.domElement;
            canvas.addEventListener('pointerdown', onPointerDown);
            canvas.addEventListener('pointermove', onPointerMove);
            canvas.addEventListener('pointerup', onPointerUp);

            window.addEventListener('resize', onWindowResize);
            animate();
        }

        function onWindowResize() {
            const container = document.getElementById('viewport-container');
            if (!container) return;
            camera.aspect = container.clientWidth / container.clientHeight;
            camera.updateProjectionMatrix();
            renderer.setSize(container.clientWidth, container.clientHeight);
        }

        function animate() {
            requestAnimationFrame(animate);
            controls.update();
            renderer.render(scene, camera);
        }

        function resetCamera() {
            camera.position.set(0, 10, 14);
            controls.target.set(0, 0, 0);
            controls.update();
        }

        // CONSTRUIR BANDEJA CON MATERIALES REALISTAS (CRISTAL, MADERA, ORO)
        function buildTray3D() {
            if (trayMesh) scene.remove(trayMesh);

            const trayData = state.trays[state.selectedTrayIndex] || state.trays[0];
            document.getElementById('current-tray-title').textContent = trayData.name;
            document.getElementById('current-tray-price').textContent = `$${Number(trayData.price).toFixed(2)}`;

            let matConfig = { roughness: 0.4, metalness: 0.1, color: trayData.color };

            if (trayData.material === 'glass') {
                matConfig = { color: 0xffffff, transparent: true, opacity: 0.45, roughness: 0.05, metalness: 0.1, transmission: 0.9 };
            } else if (trayData.material === 'gold') {
                matConfig = { color: 0xD4AF37, roughness: 0.2, metalness: 0.9 };
            } else if (trayData.material === 'black') {
                matConfig = { color: 0x1A1A1A, roughness: 0.5, metalness: 0.2 };
            } else {
                matConfig = { color: 0x8B5A2B, roughness: 0.7, metalness: 0.05 };
            }

            const baseMat = new THREE.MeshPhysicalMaterial(matConfig);
            const trayGroup = new THREE.Group();

            // Base
            const baseGeo = new THREE.BoxGeometry(8, 0.4, 6);
            const baseMesh = new THREE.Mesh(baseGeo, baseMat);
            baseMesh.position.y = -0.2;
            trayGroup.add(baseMesh);

            // Marcos / Paredes
            const wallHeight = 0.8;
            const wallThickness = 0.3;

            const backWall = new THREE.Mesh(new THREE.BoxGeometry(8, wallHeight, wallThickness), baseMat);
            backWall.position.set(0, wallHeight/2 - 0.2, -3 + wallThickness/2);
            trayGroup.add(backWall);

            const frontWall = new THREE.Mesh(new THREE.BoxGeometry(8, wallHeight, wallThickness), baseMat);
            frontWall.position.set(0, wallHeight/2 - 0.2, 3 - wallThickness/2);
            trayGroup.add(frontWall);

            const sideGeo = new THREE.BoxGeometry(wallThickness, wallHeight, 6 - wallThickness*2);
            const leftWall = new THREE.Mesh(sideGeo, baseMat);
            leftWall.position.set(-4 + wallThickness/2, wallHeight/2 - 0.2, 0);
            trayGroup.add(leftWall);

            const rightWall = new THREE.Mesh(sideGeo, baseMat);
            rightWall.position.set(4 - wallThickness/2, wallHeight/2 - 0.2, 0);
            trayGroup.add(rightWall);

            trayMesh = trayGroup;
            scene.add(trayMesh);

            updateTrayTextOnMesh();
            updateOrderSummary();
        }

        // AGREGAR PRODUCTOS
        function addProductToTray(productId) {
            const product = state.products.find(p => p.id === productId);
            if (!product) return;

            state.addedObjects.push(product);

            let geom;
            if (product.shape === 'bottle') {
                geom = new THREE.CylinderGeometry(0.3, 0.35, 2.2, 16);
            } else if (product.shape === 'sphere') {
                geom = new THREE.SphereGeometry(0.5, 16, 16);
            } else if (product.shape === 'cylinder') {
                geom = new THREE.CylinderGeometry(0.4, 0.4, 1.2, 16);
            } else {
                geom = new THREE.BoxGeometry(0.8, 0.6, 0.8);
            }

            const mat = new THREE.MeshStandardMaterial({ color: product.color || '#D4AF37', roughness: 0.3 });
            const mesh = new THREE.Mesh(geom, mat);

            // Acomodar secuencialmente dentro de la bandeja
            const count = state.addedObjects.length - 1;
            const row = Math.floor(count / 3);
            const col = count % 3;
            mesh.position.set((col - 1) * 1.8, 0.5, (row - 0.5) * 1.5);

            trayProductsGroup.add(mesh);
            updateOrderSummary();
        }

        // SITEMA DE ARRASTRE Y LÍMITES FÍSICOS (DRAG & DROP CON MARCO)
        function getPointerPos(e) {
            const rect = renderer.domElement.getBoundingClientRect();
            mouse.x = ((e.clientX - rect.left) / rect.width) * 2 - 1;
            mouse.y = -((e.clientY - rect.top) / rect.height) * 2 + 1;
        }

        function onPointerDown(e) {
            getPointerPos(e);
            raycaster.setFromCamera(mouse, camera);
            const intersects = raycaster.intersectObjects(trayProductsGroup.children);

            if (intersects.length > 0) {
                selectedObject = intersects[0].object;
                controls.enabled = false; // Detener rotación de cámara al arrastrar
            }
        }

        function onPointerMove(e) {
            if (!selectedObject) return;
            getPointerPos(e);
            raycaster.setFromCamera(mouse, camera);

            if (raycaster.ray.intersectPlane(plane, planeIntersect)) {
                // LÍMITES DENTRO DEL MARCO DE LA BANDEJA (No traspasar los bordes)
                const limitX = 3.3;
                const limitZ = 2.2;

                selectedObject.position.x = Math.max(-limitX, Math.min(limitX, planeIntersect.x));
                selectedObject.position.z = Math.max(-limitZ, Math.min(limitZ, planeIntersect.z));
            }
        }

        function onPointerUp() {
            selectedObject = null;
            controls.enabled = true; // Restaurar rotación de cámara
        }

        function clearTrayObjects() {
            state.addedObjects = [];
            while(trayProductsGroup.children.length > 0){
                trayProductsGroup.remove(trayProductsGroup.children[0]);
            }
            updateOrderSummary();
        }

        // GRABADO 3D EN LA BANDEJA
        function updateTrayText(val) {
            state.customText = val;
            updateTrayTextOnMesh();
        }

        function updateTrayTextOnMesh() {
            while(textMeshGroup.children.length > 0) {
                textMeshGroup.remove(textMeshGroup.children[0]);
            }

            if (!state.customText.trim()) return;

            const canvas = document.createElement('canvas');
            canvas.width = 512;
            canvas.height = 128;
            const ctx = canvas.getContext('2d');
            ctx.clearRect(0, 0, canvas.width, canvas.height);

            ctx.fillStyle = '#D4AF37';
            ctx.font = 'bold 40px Cinzel, serif';
            ctx.textAlign = 'center';
            ctx.textBaseline = 'middle';
            ctx.fillText(state.customText, canvas.width / 2, canvas.height / 2);

            const texture = new THREE.CanvasTexture(canvas);
            const planeGeo = new THREE.PlaneGeometry(3.5, 0.9);
            const planeMat = new THREE.MeshBasicMaterial({ map: texture, transparent: true });
            const textMesh = new THREE.Mesh(planeGeo, planeMat);
            textMesh.position.set(0, 0.45, 2.86);

            textMeshGroup.add(textMesh);
        }

        // UI RENDERERS
        function renderTraysCarousel() {
            const container = document.getElementById('trays-carousel-container');
            container.innerHTML = state.trays.map((tray, idx) => {
                const isSelected = idx === state.selectedTrayIndex;
                return `
                    <div onclick="selectTray(${idx})" class="cursor-pointer p-3 rounded-xl border-2 transition-all ${isSelected ? 'border-viane-gold bg-viane-gold/10' : 'border-viane-gold/20 bg-white'} text-center">
                        <div class="w-8 h-8 rounded-full mx-auto mb-1" style="background:${tray.color};"></div>
                        <h4 class="font-cinzel text-xs font-bold text-viane-ebony">${tray.name}</h4>
                        <p class="text-[11px] text-viane-golddark font-bold">$${Number(tray.price).toFixed(2)}</p>
                    </div>
                `;
            }).join('');
        }

        function selectTray(index) {
            state.selectedTrayIndex = index;
            buildTray3D();
            renderTraysCarousel();
        }

        function renderProductsCatalog() {
            const container = document.getElementById('products-catalog-grid');
            container.innerHTML = state.products.map(prod => `
                <div onclick="addProductToTray('${prod.id}')" class="cursor-pointer p-2.5 rounded-xl border border-viane-gold/20 bg-viane-cream/30 hover:border-viane-gold flex items-center gap-2">
                    <div class="w-8 h-8 rounded-lg flex items-center justify-center shrink-0" style="background:${prod.color}; color:#fff;">
                        <i class="fa-solid ${prod.icon} text-xs"></i>
                    </div>
                    <div class="flex-1 min-w-0">
                        <h4 class="font-cinzel text-xs font-bold text-viane-ebony truncate">${prod.name}</h4>
                        <p class="text-[10px] text-viane-golddark font-bold">$${Number(prod.price).toFixed(2)}</p>
                    </div>
                </div>
            `).join('');
        }

        function updateOrderSummary() {
            const tray = state.trays[state.selectedTrayIndex] || state.trays[0];
            let total = tray ? tray.price : 0;
            state.addedObjects.forEach(obj => total += obj.price);

            document.getElementById('items-count-badge').textContent = `${state.addedObjects.length} elementos`;
            document.getElementById('order-total-price').textContent = `$${total.toFixed(2)}`;

            let html = `<div class="flex justify-between font-semibold border-b border-white/10 pb-1"><span>${tray.name}</span><span>$${tray.price.toFixed(2)}</span></div>`;
            state.addedObjects.forEach(obj => {
                html += `<div class="flex justify-between text-viane-goldlight/80"><span>${obj.name}</span><span>$${obj.price.toFixed(2)}</span></div>`;
            });
            document.getElementById('order-items-list').innerHTML = html;
        }

        function requestQuote() {
            const tray = state.trays[state.selectedTrayIndex] || state.trays[0];
            let total = tray ? tray.price : 0;
            state.addedObjects.forEach(obj => total += obj.price);

            let msg = `Hola Viane Delicatessen ✨ Me gustaría solicitar el pedido de mi Bandeja 360°:\n\n`;
            msg += `• Bandeja: ${tray.name} ($${tray.price.toFixed(2)})\n`;
            if (state.customText) msg += `• Grabado 3D: "${state.customText}"\n`;
            msg += `• Productos incluidos (${state.addedObjects.length}):\n`;
            state.addedObjects.forEach(obj => msg += `  - ${obj.name}\n`);
            msg += `\n*Total Estimado: $${total.toFixed(2)}*`;

            window.open(`[https://wa.me/18296759640?text=$](https://wa.me/18296759640?text=$){encodeURIComponent(msg)}`, '_blank');
        }

        window.addEventListener('DOMContentLoaded', () => {
            initThree();
            renderTraysCarousel();
            renderProductsCatalog();
        });
    </script>
</body>
</html>
