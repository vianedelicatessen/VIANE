<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Configurador 3D de Bandejas - Viane Delicatessen</title>
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    <!-- Google Fonts Inter -->
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600;700&display=swap" rel="stylesheet">
    <!-- FontAwesome for Icons -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <!-- Three.js & OrbitControls CDN -->
    <script src="https://cdnjs.cloudflare.com/ajax/libs/three.js/r128/three.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/OrbitControls.js"></script>
    <style>
        body { font-family: 'Inter', sans-serif; }
        canvas { display: block; outline: none; }
        .glass-panel {
            background: rgba(35, 8, 12, 0.90);
            backdrop-filter: blur(16px);
            -webkit-backdrop-filter: blur(16px);
            border: 1px solid rgba(212, 175, 55, 0.25);
            box-shadow: 0 20px 40px rgba(0, 0, 0, 0.6);
        }
        #canvas-container {
            background-image: url('IMG-20260327-WA0017.jpg');
            background-size: cover;
            background-position: center;
            background-repeat: no-repeat;
        }
        ::-webkit-scrollbar { width: 6px; height: 6px; }
        ::-webkit-scrollbar-track { background: rgba(30, 5, 8, 0.3); }
        ::-webkit-scrollbar-thumb { background: rgba(212, 175, 55, 0.3); border-radius: 3px; }
    </style>
</head>
<body class="bg-[#1a0306] text-amber-50 h-screen overflow-hidden flex flex-col relative select-none">

    <script>
        const WHATSAPP_PHONE = "18296759640"; // Número oficial de Viane Delicatessen
    </script>

    <!-- Header Superior / Navbar con temática de marca -->
    <header class="h-16 glass-panel border-b border-amber-900/40 px-6 flex items-center justify-between z-20 shrink-0">
        <div class="flex items-center space-x-3">
            <div class="w-10 h-10 rounded-full border-2 border-amber-400/80 shadow-lg overflow-hidden flex-shrink-0 bg-[#2c080d]">
                <img src="IMG-20260327-WA0017.jpg" alt="Viane Delicatessen Logo" class="w-full h-full object-cover" onerror="this.onerror=null; this.parentElement.innerHTML='<div class=\'w-full h-full bg-gradient-to-tr from-amber-500 to-yellow-300 flex items-center justify-center text-stone-950 font-bold\'><i class=\'fa-solid fa-gift\'></i></div>';">
            </div>
            <div>
                <h1 class="font-bold text-lg text-amber-200 tracking-wide leading-tight">Viane Delicatessen 3D</h1>
                <p class="text-xs text-amber-400/80">Configurador Exclusivo de Bandejas</p>
            </div>
        </div>
        <div class="flex items-center space-x-4">
            <span class="hidden md:inline-flex items-center text-xs text-amber-300 bg-amber-500/15 px-3 py-1.5 rounded-full border border-amber-500/30">
                <i class="fa-solid fa-rotate mr-2"></i> Arrastra para rotar 360° • 829-675-9640
            </span>
        </div>
    </header>

    <main class="flex-1 relative overflow-hidden flex flex-col lg:flex-row">

        <!-- Visor 3D Three.js -->
        <div id="canvas-container" class="absolute inset-0 z-0"></div>

</body>
</html>
