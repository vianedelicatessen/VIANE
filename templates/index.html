¡Tienes toda la razón y te pido disculpas! Entiendo perfectamente la frustración. Para que la experiencia 3D sea realista y funcione exactamente como deseas, necesitamos activar dos cosas clave en el motor de Three.js dentro de `Bandeja360.html`:

1. **Arrastrar y mover elementos por la bandeja (`DragControls`):** Para que el cliente pueda presionar un producto con el ratón o el dedo y desplazarlo libremente sobre la bandeja.
2. **Límites físicos (Marco de la bandeja):** Restringir las coordenadas ($X$ y $Z$) para que los productos no se salgan del marco de la bandeja ni atraviesen los bordes.
3. **Materiales y Textura Realistas:** Configurar los materiales de Three.js segun el acabado elegido (Madera, Cristal con transparencia y refracción, Metal/Dorado brillante, etc.).

---

### Solución en `Bandeja360.html`

Abre tu archivo **`Bandeja360.html`** y aplica estos ajustes en la sección del código JavaScript:

#### 1. Importar la librería de arrastre (DragControls)
Asegúrate de tener esta etiqueta `<script>` en la cabecera (`<head>`), justo debajo de donde cargas Three.js:

```html
<script src="[https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js](https://cdn.jsdelivr.net/npm/three@0.128.0/examples/js/controls/DragControls.js)"></script>
```

#### 2. Implementar los materiales físicos y el control de arrastre con límites

Reemplaza las funciones `initThree()`, `buildTray3D()` y `addProductToTray()` por el siguiente código optimizado:

```javascript
let dragControls;
let movableObjects = [];

function initThree() {
    const container = document.getElementById('viewport-container');
    scene = new THREE.Scene();

    camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(0, 10, 14);

    renderer = new THREE.WebGLRenderer({ canvas: document.getElementById('three-canvas'), antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.shadowMap.enabled = true;

    controls = new THREE.OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;

    // Iluminación para resaltar brillos de cristal y madera
    const ambientLight = new THREE.AmbientLight(0xffffff, 0.8);
    scene.add(ambientLight);

    const dirLight = new THREE.DirectionalLight(0xfff5e6, 1.5);
    dirLight.position.set(10, 20, 15);
    dirLight.castShadow = true;
    scene.add(dirLight);

    scene.add(trayProductsGroup);
    scene.add(textMeshGroup);

    buildTray3D();

    // Habilitar Arrastre de Productos
    initDragControls();

    window.addEventListener('resize', onWindowResize);
    animate();
}

// Configuración de Materiales según acabado (Madera, Cristal, Metal, etc.)
function getTrayMaterial(materialType, customTextureUrl) {
    let matProps = {};

    if (materialType === 'glass' || materialType === 'cristal') {
        matProps = {
            color: 0xffffff,
            transparent: true,
            opacity: 0.45,
            roughness: 0.1,
            metalness: 0.1,
            transmission: 0.9, // Efecto cristalino
            ior: 1.5
        };
    } else if (materialType === 'gold') {
        matProps = {
            color: 0xD4AF37,
            roughness: 0.2,
            metalness: 0.85
        };
    } else if (materialType === 'black') {
        matProps = {
            color: 0x1A1A1A,
            roughness: 0.4,
            metalness: 0.2
        };
    } else {
        // Madera / Default
        matProps = {
            color: 0x8B5A2B,
            roughness: 0.6,
            metalness: 0.05
        };
    }

    if (customTextureUrl) {
        const texture = new THREE.TextureLoader().load(customTextureUrl);
        texture.wrapS = THREE.RepeatWrapping;
        texture.wrapT = THREE.RepeatWrapping;
        matProps.map = texture;
    }

    return new THREE.MeshPhysicalMaterial(matProps);
}

// Control de arrastre con límite de bordes
function initDragControls() {
    if (dragControls) dragControls.dispose();

    dragControls = new THREE.DragControls(movableObjects, camera, renderer.domElement);

    // Desactivar rotación de cámara mientras se arrastra un objeto
    dragControls.addEventListener('dragstart', function () {
        controls.enabled = false;
    });

    dragControls.addEventListener('drag', function (event) {
        // Fijar la altura para que el objeto no flote verticalmente
        event.object.position.y = 0.5;

        // Límites del marco de la bandeja (no salir de los bordes)
        const limitX = 3.2; // Ancho máximo
        const limitZ = 2.2; // Largo máximo

        event.object.position.x = Math.max(-limitX, Math.min(limitX, event.object.position.x));
        event.object.position.z = Math.max(-limitZ, Math.min(limitZ, event.object.position.z));
    });

    dragControls.addEventListener('dragend', function () {
        controls.enabled = true;
    });
}

function addProductToTray(productId) {
    const product = state.products.find(p => p.id === productId);
    if (!product) return;

    state.addedObjects.push(product);

    let geom, mat;
    const prodColor = product.color || '#D4AF37';
    
    if (product.shape === 'bottle') {
        geom = new THREE.CylinderGeometry(0.3, 0.35, 2.2, 16);
    } else if (product.shape === 'sphere') {
        geom = new THREE.SphereGeometry(0.5, 16, 16);
    } else {
        geom = new THREE.BoxGeometry(0.8, 0.6, 0.8);
    }

    mat = new THREE.MeshStandardMaterial({ color: prodColor, roughness: 0.3 });
    const mesh = new THREE.Mesh(geom, mat);

    // Posición inicial
    mesh.position.set(0, 0.5, 0);

    trayProductsGroup.add(mesh);
    movableObjects.push(mesh); // Añadir a los objetos arrastrables

    updateOrderSummary();
}
